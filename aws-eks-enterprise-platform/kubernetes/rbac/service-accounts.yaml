###############################################################################
# ServiceAccount — backend workload IRSA
# Deploy after: terraform apply (module.irsa_oidc)
# Role ARN comes from: terraform output -json irsa_role_arns | jq -r '.backend'
###############################################################################

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: backend
  annotations:
    # REPLACE_WITH_BACKEND_IRSA_ROLE_ARN — output from module.irsa_oidc.role_arns["backend"]
    eks.amazonaws.com/role-arn: "REPLACE_WITH_BACKEND_IRSA_ROLE_ARN"
